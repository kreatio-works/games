<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>games ─ kreatio.works</title>
<meta name="description" content="ブラウザですぐ遊べる小さなゲーム集。インストール不要・無料。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="games">
<meta name="theme-color" content="#060914">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#060914;--ink:#e9edf7;--sub:#8c96b4;--panel:rgba(18,25,46,.85);--line:#36426b;--accent:#8ee7ff;--neon:#ff8fb1;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1a2150 0,var(--bg) 60%) fixed;color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:48px 16px 40px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.3em;color:var(--accent)}
h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;margin:6px 0 10px;text-shadow:0 0 18px var(--neon)}
.lead{color:var(--sub);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
  color:inherit;text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover,.card:focus-visible{border-color:var(--neon);transform:translateY(-2px);box-shadow:0 0 22px -8px var(--neon);outline:none}
.card .t{font-family:"Dela Gothic One",sans-serif;font-size:1.4rem;line-height:1.2}
.card .t b{color:var(--neon);font-weight:400}
.card .d{font-size:.88rem;color:var(--sub)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tags span{font-family:"IBM Plex Mono",monospace;font-size:.66rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub)}
.soon{border-style:dashed;opacity:.55;pointer-events:none}
footer{margin-top:48px;font-size:.78rem;color:var(--sub);text-align:center}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">KREATIO.WORKS / GAMES</div>
  <h1>games</h1>
  <p class="lead">ブラウザですぐ遊べる小さなゲーム集。インストール不要・無料です。</p>

  <div class="grid">
    <a class="card" href="josushi/">
      <div class="t">JO<b>SUSHI</b></div>
      <div class="d">宇宙の回転寿司で、日本語の数え方（助数詞）を当てるゲーム。CPU対戦とタイムアタック。日英併記。</div>
      <div class="tags"><span>助数詞</span><span>日本語</span><span>スマホOK</span></div>
    </a>
    <div class="card soon" aria-hidden="true">
      <div class="t">coming soon</div>
      <div class="d">次のゲームを準備中。</div>
    </div>
  </div>

  <footer>
    <a href="https://kreatio-works.github.io/">kreatio.works</a> ・ <a href="https://github.com/kreatio-works/games">GitHub</a>
  </footer>
</div>
</body>
</html>
